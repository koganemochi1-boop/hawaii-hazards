name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint content + run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dev dependencies
        run: npm ci

      - name: Validate content (hazards.json + actions.json)
        run: npm run validate

      - name: Type-check (tsc --noEmit on engine + tests + validator)
        run: npm run typecheck

      - name: Run unit tests
        run: npm test
